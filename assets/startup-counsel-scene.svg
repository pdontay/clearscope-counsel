    <path d="M232 78v46" stroke="#d8cfba"/>
    <text x="74" y="107" fill="#1c1b17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">legal-stack.yml</text>
    <path d="m209 95 10 10m0-10-10 10" stroke="#a8a293" stroke-width="2" stroke-linecap="round"/>

    <g transform="translate(258 89)">
      <path d="M8 0c5 0 8 4 8 9v4l4 5H-4l4-5V9c0-5 3-9 8-9Z" fill="#e3b341"/>
      <circle cx="8" cy="21" r="2.5" fill="#bd4a2f"/>
      <circle cx="19" cy="1" r="7" fill="#d65a3c"/>
      <text x="19" y="4" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="9" font-weight="700">!</text>
    </g>
    <g transform="translate(406 98)">
      <path d="m0-8 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z" fill="#e3b341"/>
      <path d="m28-8 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z" fill="#e3b341"/>
      <path d="m56-8 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z" fill="#1f5c58"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="82" y="157" fill="#13504c" font-size="18" font-weight="700">startup_launch:</text>
      <text x="102" y="191" fill="#13504c" font-size="15" font-weight="700">entity:</text>
      <text x="176" y="191" fill="#9f4329" font-size="14.5">"Missouri LLC / Delaware C-Corp"</text>
      <text x="102" y="224" fill="#13504c" font-size="15" font-weight="700">cap_table:</text>
      <text x="198" y="224" fill="#9f4329" font-size="14.5">"Clean &amp; Unencumbered"</text>
      <text x="102" y="257" fill="#13504c" font-size="15" font-weight="700">ip_assignment:</text>
      <text x="236" y="257" fill="#9f4329" font-size="14.5">"100% Verified"</text>
      <text x="102" y="290" fill="#13504c" font-size="15" font-weight="700">diligence_ready:</text>
      <text x="258" y="290" fill="#1f5c58" font-size="14.5">true</text>
    </g>
  </g>

