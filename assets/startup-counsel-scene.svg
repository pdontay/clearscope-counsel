<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="title desc">
  <title id="title">Startup legal readiness workspace</title>
  <desc id="desc">A legal stack file lists entity formation, a clean cap table, verified intellectual property assignment, and diligence readiness while a rocket launches above it.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1c1b17" flood-opacity=".12"/>
    </filter>
    <clipPath id="panel-clip"><rect x="58" y="78" width="444" height="242" rx="17"/></clipPath>
  </defs>

  <rect width="560" height="400" fill="#f7f4ec"/>
  <g fill="#ece5d3">
    <ellipse cx="104" cy="54" rx="36" ry="13"/>
    <ellipse cx="129" cy="46" rx="25" ry="12"/>
    <ellipse cx="480" cy="190" rx="36" ry="13"/>
    <ellipse cx="505" cy="181" rx="25" ry="12"/>
  </g>
  <ellipse cx="190" cy="361" rx="145" ry="13" fill="#e9e2d2"/>
  <ellipse cx="414" cy="362" rx="118" ry="12" fill="#e9e2d2"/>

