name = "clearscope-creator-search"
main = "src/index.js"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

[[ratelimits]]
name = "SITE_SCAN_RATE_LIMITER"
namespace_id = "19401"

  [ratelimits.simple]
  limit = 5
  period = 60

# Secrets are NOT stored here. Set them once from the terminal:
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put DATABASE_URL      # the Neon POOLED string (has "-pooler")
#
# Do not add [vars] for these. Anything in [vars] ships in plaintext.
